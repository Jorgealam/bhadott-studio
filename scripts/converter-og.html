<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Conversor OG Image — BHADOTT</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 32px;
      box-sizing: border-box;
    }
    h1 { color: #60a5fa; font-size: 18px; margin: 0; }
    p  { color: #94a3b8; font-size: 14px; margin: 0; text-align: center; max-width: 520px; }
    canvas { border: 1px solid rgba(59,130,246,0.3); border-radius: 8px; max-width: 100%; }
    button {
      background: linear-gradient(135deg, #3b82f6, #7c3aed);
      color: white; border: none; border-radius: 12px;
      padding: 14px 32px; font-size: 16px; font-weight: 700;
      cursor: pointer; box-shadow: 0 0 20px rgba(59,130,246,0.4);
    }
    button:hover { opacity: 0.9; }
    .status { color: #4ade80; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🎨 Conversor OG Image — BHADOTT Remote Studios</h1>
  <p>Carregando o SVG e renderizando em canvas 1200×630px. Clique em "Baixar PNG" para salvar.</p>
  <canvas id="canvas" width="1200" height="630"></canvas>
  <button onclick="download()">⬇️ Baixar og-image.png</button>
  <p class="status" id="status">Renderizando...</p>

  <script>
    const canvas = document.getElementById('canvas')
    const ctx    = canvas.getContext('2d')
    const status = document.getElementById('status')

    // Carrega o og-image.svg da mesma pasta (scripts/)
    // Para isso, abra este HTML de dentro da pasta scripts/ ou ajuste o caminho
    const svgUrl = '../public/og-image.svg'

    const img = new Image()
    img.onload = () => {
      ctx.drawImage(img, 0, 0, 1200, 630)
      status.textContent = '✅ Renderizado! Clique em "Baixar PNG" para salvar.'
    }
    img.onerror = () => {
      status.textContent = '❌ Erro: abra este arquivo diretamente no Chrome (não via file:// duplo clique — use Live Server ou arraste para o Chrome)'
      status.style.color = '#f87171'
    }
    img.src = svgUrl

    function download() {
      const link = document.createElement('a')
      link.download = 'og-image.png'
      link.href = canvas.toDataURL('image/png', 1.0)
      link.click()
      status.textContent = '✅ Download iniciado! Mova o arquivo para a pasta public/'
    }
  </script>
</body>
</html>
